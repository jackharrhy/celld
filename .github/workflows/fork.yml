name: Fork build and release

on:
  pull_request:
  push:
    branches: [main]
    tags: ['fork-*']
  workflow_dispatch:

permissions: {}

concurrency:
  group: fork-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Read release identity
        id: identity
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          with open('fork.json') as source:
              identity = json.load(source)
          assert re.fullmatch(r'[0-9a-zA-Z.-]+', identity['version'])
          assert re.fullmatch(r'[0-9a-f]{40}', identity['upstreamRevision'])
          assert re.fullmatch(r'[0-9.]+', identity['rustVersion'])
          if os.environ['GITHUB_REF_TYPE'] == 'tag':
              assert os.environ['GITHUB_REF_NAME'] == 'fork-' + identity['version']
          subprocess.run(['git', 'merge-base', '--is-ancestor', identity['upstreamRevision'], 'HEAD'], check=True)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for key, value in identity.items():
                  print(f'{key}={value}', file=output)
          PY
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cache-binary: false
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build, test and publish
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
            ${{ github.ref_type == 'tag' && format('ghcr.io/{0}:latest', github.repository) || '' }}
            ${{ github.ref_type == 'tag' && format('ghcr.io/{0}:{1}', github.repository, github.ref_name) || '' }}
          build-args: |
            RUST_VERSION=${{ steps.identity.outputs.rustVersion }}
            CELLD_COMMIT=${{ github.sha }}
            CELLD_VERSION=${{ steps.identity.outputs.version }}
            CELLD_UPSTREAM_COMMIT=${{ steps.identity.outputs.upstreamRevision }}
          # PR builds may restore their cache; publishing builds start from source.
          cache-from: ${{ github.event_name == 'pull_request' && 'type=gha' || '' }}
          cache-to: type=gha,mode=max
          provenance: mode=max
      - name: Record consumer reference
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          DIGEST: ${{ steps.build.outputs.digest }}
          FORK_VERSION: ${{ steps.identity.outputs.version }}
        run: |
          # The backticks intentionally format the summary as Markdown.
          # shellcheck disable=SC2016
          printf 'Fork release %s\n\n`%s@%s`\n' "$FORK_VERSION" "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
