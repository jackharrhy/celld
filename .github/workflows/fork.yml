name: Fork build and release

on:
  pull_request:
  push:
    branches: [main]
    tags: ['fork-*']
  workflow_dispatch:

permissions: {}

concurrency:
  group: fork-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Read release identity
        id: identity
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          with open('fork.json') as source:
              identity = json.load(source)
          assert re.fullmatch(r'[0-9a-zA-Z.-]+', identity['version'])
          assert re.fullmatch(r'[0-9a-f]{40}', identity['upstreamRevision'])
          assert re.fullmatch(r'[0-9.]+', identity['rustVersion'])
          if os.environ['GITHUB_REF_TYPE'] == 'tag':
              assert os.environ['GITHUB_REF_NAME'] == 'fork-' + identity['version']
          subprocess.run(['git', 'merge-base', '--is-ancestor', identity['upstreamRevision'], 'HEAD'], check=True)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for key, value in identity.items():
                  print(f'{key}={value}', file=output)
          PY
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build, test and publish
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
            ${{ github.ref_type == 'tag' && format('ghcr.io/{0}:{1}', github.repository, github.ref_name) || '' }}
          build-args: |
            RUST_VERSION=${{ steps.identity.outputs.rustVersion }}
            CELLD_COMMIT=${{ github.sha }}
            CELLD_VERSION=${{ steps.identity.outputs.version }}
            CELLD_UPSTREAM_COMMIT=${{ steps.identity.outputs.upstreamRevision }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
      - name: Record consumer reference
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          DIGEST: ${{ steps.build.outputs.digest }}
          FORK_VERSION: ${{ steps.identity.outputs.version }}
        run: |
          printf 'Fork release %s\n\n`%s@%s`\n' "$FORK_VERSION" "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
