[package]
name = "celld-local-harness"
version = "0.1.0"
edition = "2021"
publish = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(celld_internal_tests)'] }

[dependencies]
anyhow = "=1.0.104"
async-trait = "=0.1.91"
bytes = "=1.12.1"
chrono = "=0.4.45"
futures-util = "=0.3.33"
object_store = { version = "=0.12.5", default-features = false, features = ["aws", "azure", "gcp", "integration"] }
rusqlite = { version = "=0.39.0", features = ["bundled", "fallible_uint"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["full"] }
tempfile = "=3.27.0"
rand = "=0.8.7"
libc = "=0.2.189"
celld-ltx = { path = "../../crates/ltx", features = ["s3"] }

[profile.dev]
debug = 0

[workspace]
